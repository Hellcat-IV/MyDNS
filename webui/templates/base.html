<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LocalDNS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar-brand { font-weight: 700; letter-spacing: -.5px; }
        .badge-type { font-size: .72em; font-weight: 600; }
        .disabled-row td { opacity: .45; }
        .font-mono { font-family: ui-monospace, monospace; }
        .table > :not(caption) > * > * { vertical-align: middle; }
    </style>
</head>
<body>
{% if current_user.is_authenticated %}
<nav class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="{{ url_for('records_list') }}">
            <i class="bi bi-hdd-network-fill text-info"></i> LocalDNS
        </a>
        <div class="navbar-nav ms-auto flex-row gap-2">
            <a class="nav-link px-2" href="{{ url_for('admin_password') }}" title="Change password">
                <i class="bi bi-person-circle"></i>
                <span class="d-none d-sm-inline ms-1">{{ current_user.username }}</span>
            </a>
            <a class="nav-link px-2" href="{{ url_for('logout') }}" title="Logout">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
    </div>
</nav>
{% endif %}

<div class="container-fluid px-4 mt-4" style="max-width:1200px">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
